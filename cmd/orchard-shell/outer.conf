# Outer tmux server config — issue #747 spike.
#
# This is the OUTER wrapper session's config, loaded explicitly via `-f` by
# orchard-shell (and verify.sh). It is NOT the user's ~/.tmux.conf — a separate
# `-L` socket does not, by itself, suppress loading the real dotfile; `-f`
# must always be passed to control what this server loads.
#
# Layout this config assumes: one window, two panes.
#   pane 0 (left, 40 cols) — sidebar placeholder
#   pane 1 (right)         — nested inner tmux client (TMUX= cleared)
#
# The sidebar's width must survive anything the INNER session does to its
# own panes/windows (new-window, kill-pane, split, resize, zoom) since none
# of that touches the outer session at all. It must also survive outer-level
# resizes (a real terminal resize, or a scripted `resize-window`). Two
# different tmux hooks cover two different trigger paths:
#   - client-resized  fires when an ATTACHED client's terminal changes size
#                      (real SIGWINCH-driven resize).
#   - window-resized   fires on any window resize, including a `resize-window`
#                      command run against a DETACHED session (client-resized
#                      does not fire in that case — proven empirically).
# Both are needed; neither subsumes the other.

set -g status off
set -g mouse on
set -g escape-time 0

# remain-on-exit: a pane whose process exits stays as a DEAD pane instead of
# closing and renumbering its sibling. Without it, the sidebar (0.0) dying
# collapses the window to one pane and silently renumbers 0.1 down to 0.0 --
# probe()/decide()/rebuild() (outer.go) depend on a dead pane staying
# addressable at its own index instead of vanishing.
set -g remain-on-exit on

# Minimal visual cue that the OUTER server owns this frame, distinct from
# whatever theme the inner session (or the user's real ~/.tmux.conf) draws
# inside pane 0.1 — dim and identical on both panes so it reads as "this is
# a container", not a second layer of focus/active-pane noise.
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour238'
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-indicators off

# No prefix. A prefix key at THIS layer swallows itself AND whatever key
# comes next before either ever reaches pane 0.1 — with `C-a` as prefix that
# broke Ctrl-A (readline start-of-line) inside the inner shell, because both
# keystrokes are consumed here, never forwarded down. Outer's few actions
# live in the root key table on Alt bindings instead — no shell or inner
# tmux config reaches for M-s/M-p/M-d, so every other keystroke, including
# the inner session's own prefix, falls straight through untouched.
#
# Deliberately NOT `unbind -a -T prefix`: with no key bound to enter it
# (`prefix`/`prefix2` both None, and nothing in the root table below
# switches into it), the prefix table is already unreachable regardless
# of what's bound inside it -- emptying it added nothing. It also broke
# re-sourcing: `unbind -a` drops a table to zero bindings, tmux then
# garbage-collects a table with nothing left in it, and a SECOND
# `source-file` (hot-applying a later change to an already-configured
# server) failed with "table prefix doesn't exist" trying to unbind a
# table that, by then, no longer existed.
set -g prefix None

# THE SIDEBAR'S WIDTH LIVES HERE, in main-pane-width on this server.
#
# Three places re-pin the sidebar pane -- M-s below and the two resize hooks
# at the bottom -- and all three read that one option. The sidebar publishes a
# width the user DRAGS the pane border to, and nothing else; it never reads
# the option back, learning its own width from the pane size it is handed.
# Two owners was the bug: the hooks re-pinned to a hard-coded 40, the sidebar
# read that back as a fresh drag, and a drag to 60 survived exactly until the
# next terminal resize.
#
# It is tmux's own "how wide is the left column" option, not a user option
# (@orchard_sidebar_width), because a user option cannot be read back out
# SYNCHRONOUSLY. `resize-pane -x` does not expand formats in its argument
# ("width invalid" -- measured, tmux 3.6a), and the run-shell workaround that
# does expand them returns before its shell has resized anything: the pane
# then sits at the wrong width for a beat after every resize. `select-layout
# main-vertical` reads main-pane-width inside tmux, with no shell and no
# delay, and it is a no-op on a window that still has only one pane (during
# boot, before orchard-shell splits).
#
# The default below is the width orchard-shell splits at; the sidebar overrides it
# per-window once the user drags. main-vertical puts pane 0 -- the sidebar --
# in that left column, which is the same "sidebar is 0.0" assumption every
# other binding here already makes.
set -g main-pane-width 40

# @sidebar_collapsed is the other half, window-scoped: `-F` treats an unset
# (empty) or "0" value as false, so the very first M-s on a freshly-booted
# wrapper collapses, which is what an untouched sidebar should do. Collapsed
# pins a literal 3 rather than a remembered width, which is why that branch
# needs no option at all -- and why main-pane-width still holds the width the
# sidebar will reopen to.
bind -n M-s if-shell -F '#{@sidebar_collapsed}' \
  'set -w @sidebar_collapsed 0 ; select-layout main-vertical' \
  'resize-pane -t 0.0 -x 3 ; set -w @sidebar_collapsed 1'
bind -n M-p display-popup -E -w 80% -h 80% "$SHELL"
bind -n M-d detach-client

# Mouse forwarding, not mouse handling: outer only ever decides WHICH pane
# a mouse event's raw bytes go to, then gets out of the way. Click-to-focus
# is tmux's own default MouseDown1Pane binding (`select-pane -t = ;
# send-keys -M`) -- `mouse on` alone is enough, no bind needed. Two default
# bindings fight that goal and are turned off:
#   - MouseDrag1Pane   defaults to entering outer's OWN copy-mode on a drag
#                      over an unfocused/non-alternate pane -- exactly what
#                      must never happen to pane 0.1's inner tmux client.
#   - MouseDrag1Border defaults to `resize-pane -M`, which would let a drag
#                      shrink the pinned 40-col sidebar (the resize hooks
#                      below only correct WINDOW resizes, not a pane border
#                      drag within an unchanged window).
# Wheel scroll has no such rescue: on this tmux build MouseDrag1Pane and
# WheelUpPane both fall back to outer copy-mode only when
# pane_in_mode/mouse_any_flag/alternate_on are all false, and WheelDownPane
# has NO default root-table binding at all (verified via
# `tmux list-keys -T root`) -- wheel-down over any pane is silently
# swallowed, forwarded nowhere. Binding both wheel directions to
# `send-keys -M` unconditionally forwards the raw scroll event to whichever
# pane is under the cursor and never opens outer's own copy-mode, so the
# inner tmux client (or the sidebar) handles the scroll per its own mouse
# config, exactly like a click already does.
unbind -n MouseDrag1Pane
unbind -n MouseDrag1Border
bind -n WheelUpPane send-keys -M
bind -n WheelDownPane send-keys -M

# Stock tmux binds MouseDown3Pane/M-MouseDown3Pane to a big `display-menu`
# popup (Split/Swap/Kill/Respawn/Zoom) whenever the pane isn't already in
# a mode or a mouse-tracking app — a right-click meant to focus/forward to
# the inner session could instead kill or respawn a pane at the OUTER
# layer. Replaced with the same unconditional forward as MouseDown1Pane:
# right-click always focuses and forwards, never opens outer's own menu.
bind -n MouseDown3Pane select-pane -t = \; send-keys -M
bind -n M-MouseDown3Pane select-pane -t = \; send-keys -M

# Status-line and scrollbar mouse bindings are unreachable in practice
# (status is off; no scrollbar is enabled) but still live in the root
# table by default, including more `display-menu`/`kill-`/`respawn`/
# `swap-` actions (window and session menus) on MouseDown3Status(Left)
# and its Meta variants. Stripped for defense in depth rather than relied
# on being merely unreachable.
unbind -n MouseDown1Status
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3Status
unbind -n M-MouseDown3StatusLeft
unbind -n WheelUpStatus
unbind -n WheelDownStatus

# Scrollbars, and therefore their key names, only exist from tmux 3.6. On an
# older server (the deploy target runs 3.4) each of these unbinds is an
# "unknown key" error at every attach -- and there is nothing to strip there
# anyway, since the bindings do not exist.
#
# The test is a glob, not a numeric compare, because tmux versions are not
# numbers ("3.6a", "next-3.7"): a version matching 3.0-3.5 yields 1, which
# the ?: inverts to 0 so the block is skipped. It is written as one positive
# %if because an EMPTY %if branch is a tmux syntax error, and a syntax error
# stops the rest of the file loading -- taking the resize hooks below with it.
%if "#{?#{m:3.[0-5]*,#{version}},0,1}"
unbind -n MouseDown1ScrollbarUp
unbind -n MouseDown1ScrollbarDown
unbind -n MouseDrag1ScrollbarSlider
%endif

# Keyboard fallback for focus, alongside the mouse: M-s/M-p/M-d above are
# per-pane actions, not focus moves, so they don't overlap these.
bind -n M-Left select-pane -t 0.0
bind -n M-Right select-pane -t 0.1

# Drive the sidebar's selection from wherever the keyboard happens to be.
#
# Bare Up/Down already work when pane 0.0 holds focus -- but it usually does
# NOT: clicking a card hands focus straight back to 0.1 (that is the point of
# the hand-back), so the very gesture that puts a user in front of the sidebar
# also takes the arrow keys away from it. Binding bare Up/Down here instead
# would fix that by stealing arrows from the inner shell and from Claude,
# which is far worse than the problem. M-Up/M-Down forward the plain arrow to
# pane 0.0 explicitly, so sidebar navigation works from either pane while the
# unmodified arrows stay the inner client's, and they cost nothing when the
# sidebar is collapsed (it still tracks the selection, just draws a strip).
bind -n M-Up send-keys -t 0.0 Up
bind -n M-Down send-keys -t 0.0 Down

# And straight to the nth card, for the same reason and by the same route:
# M-1..M-9 forward the chord itself to pane 0.0, where the sidebar reads it as
# "select the nth VISIBLE card and hand focus back" (cmd/orchard-sidebar/
# jump.go). The cards carry matching superscript markers, so the chord is
# readable off the list rather than counted.
#
# Nine, not ten: M-0 has no ordinal to mark it with and stays the inner
# session's. Written out one line per key because a tmux config has no loop,
# and as `send-keys -t 0.0 M-N` rather than a literal escape sequence so tmux
# owns the encoding on both ends.
bind -n M-1 send-keys -t 0.0 M-1
bind -n M-2 send-keys -t 0.0 M-2
bind -n M-3 send-keys -t 0.0 M-3
bind -n M-4 send-keys -t 0.0 M-4
bind -n M-5 send-keys -t 0.0 M-5
bind -n M-6 send-keys -t 0.0 M-6
bind -n M-7 send-keys -t 0.0 M-7
bind -n M-8 send-keys -t 0.0 M-8
bind -n M-9 send-keys -t 0.0 M-9

# Both hooks re-pin to whichever width the sidebar is currently SUPPOSED to
# have -- the collapsed strip, or main-pane-width (see M-s above). Pinning
# unconditionally to 40 lost every dragged width on the next terminal resize,
# and popped a collapsed sidebar back open behind the user.
#
# Synchronously, both of them: a resize that re-pins a moment LATER leaves the
# sidebar visibly wrong-sized after every terminal resize, and leaves anything
# reading the width straight afterwards reading the un-pinned one.
set-hook -g client-resized 'if-shell -F "#{@sidebar_collapsed}" "resize-pane -t 0.0 -x 3" "select-layout main-vertical"'
set-hook -g window-resized 'if-shell -F "#{@sidebar_collapsed}" "resize-pane -t 0.0 -x 3" "select-layout main-vertical"'
