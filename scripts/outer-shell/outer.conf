# Outer tmux server config — issue #747 spike.
#
# This is the OUTER wrapper session's config, loaded explicitly via `-f` by
# launch.sh (and verify.sh). It is NOT the user's ~/.tmux.conf — a separate
# `-L` socket does not, by itself, suppress loading the real dotfile; `-f`
# must always be passed to control what this server loads.
#
# Layout this config assumes: one window, two panes.
#   pane 0 (left, 40 cols) — sidebar placeholder
#   pane 1 (right)         — nested inner tmux client (TMUX= cleared)
#
# The sidebar's width must survive anything the INNER session does to its
# own panes/windows (new-window, kill-pane, split, resize, zoom) since none
# of that touches the outer session at all. It must also survive outer-level
# resizes (a real terminal resize, or a scripted `resize-window`). Two
# different tmux hooks cover two different trigger paths:
#   - client-resized  fires when an ATTACHED client's terminal changes size
#                      (real SIGWINCH-driven resize).
#   - window-resized   fires on any window resize, including a `resize-window`
#                      command run against a DETACHED session (client-resized
#                      does not fire in that case — proven empirically).
# Both are needed; neither subsumes the other.

set -g status off
set -g mouse off
set -g escape-time 0

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set-hook -g client-resized 'resize-pane -t 0.0 -x 40'
set-hook -g window-resized 'resize-pane -t 0.0 -x 40'
