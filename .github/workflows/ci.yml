name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Note: orchard-gui (Tauri) requires GTK/WebKit system libs on Linux that
  # we don't install in CI to keep it cheap. Drew validates the GUI crate
  # locally on macOS via `cargo tauri dev`. CI only validates the orchard
  # CLI/TUI crate.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check -p orchard --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p orchard

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy -p orchard --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  schema:
    name: Schema Up-To-Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Regenerate schema
        run: cargo build -p orchard
      - name: Verify schema.json matches committed version
        run: |
          if ! git diff --exit-code -- crates/orchard/schema.json; then
            echo "::error::schema.json is out of sync. Run 'cargo build -p orchard' and commit the updated crates/orchard/schema.json."
            exit 1
          fi

  go:
    name: Go
    runs-on: ubuntu-latest
    # The daemon (every resolver, provider, and loader) is Go. Until #712
    # this workflow ran only `cargo test -p orchard`, so no Go test in the
    # repo ran in CI and a green badge on a daemon PR proved nothing about
    # the daemon — seven resolver tests sat red on main unnoticed (#664).
    #
    # The suite is hermetic: it needs no tmux, gh, or systemd on the runner.
    # Tests that shell out either install a fake `gh` script onto PATH, stub
    # the systemctl seam, or t.Skip behind an exec.LookPath guard. Where the
    # runner image does happen to ship a binary (tmux), the guarded tests run
    # for real and add coverage rather than requiring it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Single source of truth for the toolchain version.
          go-version-file: go.mod
          # Caches the module cache and build cache, keyed on go.sum.
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  bats:
    name: Bats (scripts)
    runs-on: ubuntu-latest
    # Runs the scripts/**/*.bats suite (L2-envelope assertions on the shell
    # scripts under scripts/gh, scripts/git, scripts/host-services,
    # scripts/tmux). The conversation-contracts plugin (and its bats suite)
    # was retired 2026-05-29 — see .claude-plugin/marketplace.json.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run scripts bats
        run: bats -r scripts plugin-sources

  gui-stop-bleed:
    name: GUI stop-bleed (no new <style> blocks)
    runs-on: ubuntu-latest
    # Per ADR-020, new orchard-gui components must use Tailwind utilities,
    # not scoped <style> blocks. This guard enforces the rule on PRs.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # need history to diff against base
      - name: Run stop-bleed check
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          crates/orchard-gui/scripts/stop-bleed-check.sh "origin/$BASE_REF"
