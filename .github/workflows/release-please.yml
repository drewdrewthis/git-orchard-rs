name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to re-assemble suite tarballs + SHA256SUMS for (e.g. orchard-v1.2.0)'
        required: true
        type: string

permissions:
  contents: write      # push version bump commits and tags
  pull-requests: write # open/update release PRs
  issues: write        # allow release-please to manage issues

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    # Manifest-mode outputs are namespaced by path (e.g. `crates/orchard--tag_name`)
    # and never populate the singular root-level `release_created`. `paths_released`
    # is the aggregate gate; `outputs_json` forwards the full output map so downstream
    # jobs can look up per-path values dynamically. See issue #335.
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      outputs_json: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]' }}
    name: Build ${{ matrix.path }} ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
        target:
          - { name: aarch64-apple-darwin, os: macos-14, cross: false }
          - { name: x86_64-apple-darwin, os: macos-14, cross: false }
          - { name: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: false }
          - { name: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target.name }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.path }}-${{ matrix.target.name }}
      - name: Derive tag
        id: meta
        env:
          OUTPUTS_JSON: ${{ needs.release-please.outputs.outputs_json }}
          PATH_KEY: ${{ matrix.path }}
        run: |
          tag=$(printf '%s' "$OUTPUTS_JSON" | jq -r --arg key "${PATH_KEY}--tag_name" '.[$key]')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "error: no tag found for path $PATH_KEY" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install cross-compilation tools
        if: matrix.target.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      # matrix.path is crates/orchard -- the sole release-please-tracked
      # package (ADR-022/D2) -- which houses two binaries: orchard-dispatcher
      # crate's `orchard` (the CLI users invoke; npm/install.js hardcodes
      # this tarball's name and contents, plan AC12) and this crate's own
      # `orchard-tui`. Build, package, and checksum both explicitly: the
      # prior single generic basename(matrix.path) step assumed one binary
      # named after the package directory, which produced neither and broke
      # every release's Package step (#747 boy-scout fix).
      - name: Build dispatcher (orchard)
        run: cargo build --release --target ${{ matrix.target.name }} -p orchard-dispatcher
      - name: Package dispatcher
        run: tar czf orchard-${{ matrix.target.name }}.tar.gz -C target/${{ matrix.target.name }}/release orchard
      - name: Checksum dispatcher
        run: shasum -a 256 orchard-${{ matrix.target.name }}.tar.gz > orchard-${{ matrix.target.name }}.tar.gz.sha256
      - name: Build TUI (orchard-tui)
        # Stamp ORCHARD_REVISION explicitly (build.rs reads it, mirroring
        # scripts/dist.sh). Otherwise build.rs falls back to `git status
        # --porcelain`, which sees the untracked dispatcher tarball packaged
        # just above (repo root, not gitignored) and stamps `<sha>+dirty` (#817).
        env:
          ORCHARD_REVISION: ${{ github.sha }}
        run: cargo build --release --target ${{ matrix.target.name }} -p orchard
      - name: Package TUI
        run: tar czf orchard-tui-${{ matrix.target.name }}.tar.gz -C target/${{ matrix.target.name }}/release orchard-tui
      - name: Checksum TUI
        run: shasum -a 256 orchard-tui-${{ matrix.target.name }}.tar.gz > orchard-tui-${{ matrix.target.name }}.tar.gz.sha256
      - name: Upload
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            orchard-${{ matrix.target.name }}.tar.gz
            orchard-${{ matrix.target.name }}.tar.gz.sha256
            orchard-tui-${{ matrix.target.name }}.tar.gz
            orchard-tui-${{ matrix.target.name }}.tar.gz.sha256

  build-go:
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]' && contains(fromJSON(needs.release-please.outputs.paths_released), 'crates/orchard') }}
    name: Build Go binaries ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64, name: x86_64-unknown-linux-gnu }
          - { goos: linux, goarch: arm64, name: aarch64-unknown-linux-gnu }
          - { goos: darwin, goarch: amd64, name: x86_64-apple-darwin }
          - { goos: darwin, goarch: arm64, name: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Derive tag and version
        id: meta
        env:
          OUTPUTS_JSON: ${{ needs.release-please.outputs.outputs_json }}
        run: |
          tag=$(printf '%s' "$OUTPUTS_JSON" | jq -r '."crates/orchard--tag_name"')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "error: no crates/orchard tag found in release-please outputs" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*v}" >> "$GITHUB_OUTPUT"
      - name: Build, package, checksum
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
          TRIPLE: ${{ matrix.target.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Suite binaries baked with the release VERSION + REVISION, mirroring
          # scripts/dist.sh. A binary whose cmd/ dir doesn't exist yet is
          # skipped (mid-rollout tolerance), not failed; an existing dir that
          # fails to *compile* still fails this step, as it should.
          #
          # Outputs go into the gitignored dist/ (not the repo root) so
          # `git status --porcelain` stays clean between builds. Previously the
          # binary + tarball landed in the root untracked, so Go's buildvcs saw
          # a dirty tree and stamped vcs.modified=true -> `<sha>+dirty` on every
          # binary after the first (orchard-daemon), which built clean (#817).
          # REVISION is also passed explicitly (matches Makefile GO_LDFLAGS /
          # scripts/dist.sh) so the revision is pinned even absent a VCS stamp.
          mkdir -p dist
          for bin in orchard-daemon orchard-sidebar orchard-shell orchard-upgrade; do
            if [ ! -d "cmd/$bin" ]; then
              echo "skip $bin: cmd/$bin does not exist yet"
              continue
            fi
            go build -ldflags "-X main.version=$VERSION -X github.com/drewdrewthis/orchardist/internal/release.revision=$REVISION" -o "dist/$bin" "./cmd/$bin"
            tar czf "dist/$bin-$TRIPLE.tar.gz" -C dist "$bin"
            ( cd dist && shasum -a 256 "$bin-$TRIPLE.tar.gz" > "$bin-$TRIPLE.tar.gz.sha256" )
          done
      - name: Upload
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          # fail_on_unmatched_files defaults to false: tolerates a binary
          # skipped above because its cmd/ dir doesn't exist yet.
          files: |
            dist/orchard-*-${{ matrix.target.name }}.tar.gz
            dist/orchard-*-${{ matrix.target.name }}.tar.gz.sha256

  checksums:
    needs: [release-please, build, build-go]
    # On workflow_dispatch the release-please/build jobs are skipped, so
    # `!cancelled()` is required to reach this job at all (#815). On push,
    # gate on build success explicitly since `!cancelled()` disables the
    # implicit needs-succeeded check.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          needs.build.result == 'success' &&
          needs.build-go.result == 'success' &&
          needs.release-please.outputs.paths_released != '' &&
          needs.release-please.outputs.paths_released != '[]' &&
          contains(fromJSON(needs.release-please.outputs.paths_released), 'crates/orchard')
        )
      ) }}
    name: Assemble suite tarballs + SHA256SUMS
    runs-on: ubuntu-latest
    steps:
      # Checkout + Go are needed by the revision-verification step below
      # (scripts/check-suite-revisions.sh reads the repo and runs `go version
      # -m`). This job had no checkout previously.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Derive tag
        id: meta
        env:
          OUTPUTS_JSON: ${{ needs.release-please.outputs.outputs_json }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(printf '%s' "$OUTPUTS_JSON" | jq -r '."crates/orchard--tag_name"')
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "error: no crates/orchard tag found in release-please outputs" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Assemble per-triple suite tarballs + aggregate SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          triples="x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"
          # Mirrors internal/release/assets.go's SuiteBinaries -- the Go
          # upgrade client's ground truth for what a release must contain.
          suite_bins="orchard-daemon orchard-sidebar orchard-shell orchard-upgrade orchard-tui orchard"
          mkdir -p dist
          missing_dispatcher=""
          for triple in $triples; do
            # orchard-<triple>.tar.gz (the dispatcher) is the one asset
            # npm/install.js hardcodes (plan AC12) -- its absence for any
            # triple is a broken release, not a partial one. This is exactly
            # the check that would have caught the pre-#747 build-job bug
            # that shipped zero dispatcher assets.
            if ! gh release download "$TAG" -R "$REPO" -p "orchard-${triple}.tar.gz" -D dist --clobber 2>/dev/null; then
              missing_dispatcher="$missing_dispatcher orchard-${triple}.tar.gz"
            fi
            work="$(mktemp -d)"
            got=0
            for bin in $suite_bins; do
              asset="${bin}-${triple}.tar.gz"
              if gh release download "$TAG" -R "$REPO" -p "$asset" -D dist --clobber 2>/dev/null; then
                tar xzf "dist/$asset" -C "$work"
                got=$((got + 1))
              else
                echo "note: $asset not published for $triple"
              fi
            done
            if [ "$got" -gt 0 ]; then
              tar czf "dist/orchard-suite-${triple}.tar.gz" -C "$work" .
              echo "wrote orchard-suite-${triple}.tar.gz ($got/6 binaries)"
            else
              echo "note: no suite binaries found for $triple, skipping orchard-suite-${triple}.tar.gz"
            fi
            rm -rf "$work"
          done
          if [ -n "$missing_dispatcher" ]; then
            echo "FATAL: dispatcher asset(s) missing from release $TAG:$missing_dispatcher" >&2
            echo "(npm/install.js hardcodes orchard-<triple>.tar.gz -- a release without it breaks every npm install)" >&2
            exit 1
          fi
          cd dist
          shasum -a 256 -- *.tar.gz > SHA256SUMS
      - name: Verify suite binaries share one clean revision (#817)
        run: scripts/check-suite-revisions.sh dist/orchard-suite-*.tar.gz
      - name: Upload suite tarballs + SHA256SUMS
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/orchard-suite-*.tar.gz
            dist/SHA256SUMS

  npm-publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]' && contains(fromJSON(needs.release-please.outputs.paths_released), 'crates/orchard') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Set version from release tag
        env:
          OUTPUTS_JSON: ${{ needs.release-please.outputs.outputs_json }}
        run: |
          tag=$(printf '%s' "$OUTPUTS_JSON" | jq -r '."crates/orchard--tag_name"')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "error: no crates/orchard tag found in release-please outputs" >&2
            exit 1
          fi
          VERSION="${tag##*v}"
          cd npm
          npm version "$VERSION" --no-git-tag-version
      - name: Publish to npm
        run: npm publish ./npm --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''
